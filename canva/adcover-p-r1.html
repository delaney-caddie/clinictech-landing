<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:#222;display:flex;
  flex-direction:column;gap:40px;padding:40px}

/* Background sampled from the ad creatives: royal blue diagonal gradient,
   brighter toward the upper right, deepening into the bottom-right corner,
   over a subtle white dot grid. */
.cover{position:relative;overflow:hidden;color:#fff;
  background-image:
    radial-gradient(circle, #ffffff1f 1.5px, #0000 1.5px),
    radial-gradient(900px 620px at 72% 8%, #3A5CEA, #0000 62%),
    radial-gradient(700px 520px at 100% 118%, #16266F, #0000 60%),
    linear-gradient(152deg, #1E3FD4 0%, #2C4BDA 48%, #22349B 100%);
  background-size: 26px 26px, auto, auto, auto;
}
.accent{color:#A8C4FF}

/* ---------- personal: 1584x396 ---------- */
.personal{width:1584px;height:396px}
.p-logo{position:absolute;left:430px;top:52px;height:38px;filter:brightness(0) invert(1)}
.p-head{position:absolute;left:430px;top:112px;width:600px;
  font-size:46px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.p-pill{position:absolute;left:430px;bottom:44px;background:#DFFF75;color:#16266F;
  border-radius:999px;padding:11px 26px;font-size:19px;font-weight:700;letter-spacing:-.01em}
.p-agents{position:absolute;right:70px;top:50%;transform:translateY(-50%);display:flex;gap:22px}
.p-agents figure{width:132px}
.p-agents span{display:block;width:132px;height:132px;border-radius:999px;
  background:var(--bg);overflow:hidden;border:4px solid #ffffff59}
.p-agents img{width:100%;height:100%;object-fit:cover;display:block}
.p-agents b{display:block;text-align:center;font-size:21px;font-weight:700;margin-top:12px}
.p-agents em{display:block;text-align:center;font-style:normal;font-size:14px;
  font-weight:500;color:#B9CBFF;margin-top:2px;line-height:1.25}

/* ---------- company: 1128x191 ---------- */
.company{width:1128px;height:191px}
.c-logo{position:absolute;left:48px;top:30px;height:26px;filter:brightness(0) invert(1)}
.c-head{position:absolute;left:48px;top:72px;width:600px;
  font-size:27px;font-weight:800;letter-spacing:-.025em;line-height:1.22}
.c-agents{position:absolute;right:44px;top:50%;transform:translateY(-50%);display:flex;gap:14px}
.c-agents span{display:block;width:96px;height:96px;border-radius:999px;
  background:var(--bg);overflow:hidden;border:3px solid #ffffff59}
.c-agents img{width:100%;height:100%;object-fit:cover;display:block}
</style></head>
