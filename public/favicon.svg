<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- objectBoundingBox units, so each dot gets its own left-to-right ramp,
         matching the source artwork. -->
    <linearGradient id="cd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000C5E"/>
      <stop offset="1" stop-color="#021A7C"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="#C3CDFB"/>
  <g fill="url(#cd)">
    <circle cx="57.22" cy="30.56" r="20.56"/>
    <circle cx="72.59" cy="72.59" r="17.04"/>
    <circle cx="22.59" cy="72.59" r="10.37"/>
    <circle cx="20.93" cy="45" r="10.19"/>
    <circle cx="43.33" cy="63.7" r="5.19"/>
  </g>
</svg>
