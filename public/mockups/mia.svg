<svg viewBox="0 0 1500 980" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1500" height="980" fill="#F8FAFC"/>
  <!-- sidebar -->
  <rect width="248" height="980" fill="#FFFFFF"/>
  <line x1="248" y1="0" x2="248" y2="980" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="46" cy="46" r="14" fill="#2563EB"/>
  <text x="70" y="52" font-size="21" font-weight="700" fill="#0F172A">ClinicTech</text>
  <text x="32" y="112" font-size="19" fill="#64748B">Home</text>
  <text x="32" y="156" font-size="19" fill="#64748B">Pipeline</text>
  <text x="32" y="200" font-size="19" fill="#64748B">Calendar</text>
  <text x="32" y="244" font-size="19" fill="#64748B">Library</text>
  <text x="32" y="308" font-size="14" font-weight="700" fill="#94A3B8" letter-spacing="1.5">AGENTS</text>
  <rect x="20" y="324" width="208" height="44" rx="10" fill="rgba(37,99,235,0.10)"/>
  <circle cx="42" cy="346" r="6" fill="#2563EB"/><text x="60" y="353" font-size="19" font-weight="700" fill="#1D4ED8">Mia</text>
  <circle cx="42" cy="390" r="6" fill="#7C3AED"/><text x="60" y="397" font-size="19" fill="#64748B">Vidi</text>
  <circle cx="42" cy="434" r="6" fill="#DB2777"/><text x="60" y="441" font-size="19" fill="#64748B">Rio</text>
  <circle cx="42" cy="478" r="6" fill="#16A34A"/><text x="60" y="485" font-size="19" fill="#64748B">Juno</text>
  <circle cx="42" cy="522" r="6" fill="#0D9488"/><text x="60" y="529" font-size="19" fill="#64748B">Quill</text>
  <circle cx="42" cy="566" r="6" fill="#D97706"/><text x="60" y="573" font-size="19" fill="#64748B">Atlas</text>

  <!-- header -->
  <text x="292" y="70" font-size="30" font-weight="800" fill="#0F172A">Mia &#183; Front desk, covered</text>
  <text x="292" y="102" font-size="18" fill="#64748B">Live across phone, web chat, SMS, and WhatsApp &#183; English and Spanish</text>

  <!-- stat cards -->
  <g>
    <rect x="292" y="130" width="272" height="104" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="316" y="178" font-size="30" font-weight="800" fill="#2563EB">3 sec</text>
    <text x="316" y="208" font-size="16" fill="#64748B">average first reply</text>
    <rect x="580" y="130" width="272" height="104" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="604" y="178" font-size="30" font-weight="800" fill="#0F172A">42</text>
    <text x="604" y="208" font-size="16" fill="#64748B">conversations handled today</text>
    <rect x="868" y="130" width="272" height="104" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="892" y="178" font-size="30" font-weight="800" fill="#16A34A">9</text>
    <text x="892" y="208" font-size="16" fill="#64748B">consults booked today</text>
    <rect x="1156" y="130" width="272" height="104" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="1180" y="178" font-size="30" font-weight="800" fill="#0F172A">2</text>
    <text x="1180" y="208" font-size="16" fill="#64748B">handed to your team</text>
  </g>

  <!-- live conversation -->
  <rect x="292" y="266" width="700" height="672" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="320" y="312" font-size="16" font-weight="700" fill="#94A3B8" letter-spacing="1.2">LIVE CONVERSATION &#183; 11:04 PM</text>
  <rect x="758" y="292" width="90" height="30" rx="15" fill="#EFF6FF"/>
  <text x="803" y="313" font-size="14" font-weight="700" fill="#2563EB" text-anchor="middle">Web chat</text>
  <rect x="858" y="292" width="106" height="30" rx="15" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="911" y="313" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle">+3 channels</text>

  <g font-size="18">
    <!-- patient bubble -->
    <rect x="316" y="342" width="430" height="88" rx="16" fill="#F1F5F9"/>
    <text x="340" y="378" fill="#334155">Hi, do you treat chronic knee pain? And</text>
    <text x="340" y="408" fill="#334155">roughly what does it cost?</text>
    <!-- mia bubble -->
    <rect x="426" y="446" width="542" height="118" rx="16" fill="#2563EB"/>
    <text x="450" y="482" fill="#FFFFFF">We do. Plans usually range from $3,000 to</text>
    <text x="450" y="512" fill="#FFFFFF">$9,000 depending on your case. Want a free</text>
    <text x="450" y="542" fill="#FFFFFF">consult with Dr. Rivera to find out?</text>
    <!-- patient bubble -->
    <rect x="316" y="580" width="360" height="58" rx="16" fill="#F1F5F9"/>
    <text x="340" y="617" fill="#334155">Yes please, mornings work best.</text>
    <!-- mia bubble -->
    <rect x="426" y="654" width="542" height="88" rx="16" fill="#2563EB"/>
    <text x="450" y="690" fill="#FFFFFF">Done. Tuesday at 10:00 AM. I texted you a</text>
    <text x="450" y="720" fill="#FFFFFF">confirmation with directions.</text>
  </g>
  <!-- booked chip -->
  <rect x="316" y="772" width="652" height="58" rx="12" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="340" y="808" font-size="17" font-weight="700" fill="#15803D">&#10003;  Consult booked &#183; calendar updated &#183; reminder scheduled</text>
  <text x="316" y="880" font-size="15" fill="#94A3B8">Replied in 3 seconds. Total time from question to booked consult: 90 seconds.</text>

  <!-- capabilities panel -->
  <rect x="1024" y="266" width="404" height="672" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="1052" y="312" font-size="16" font-weight="700" fill="#94A3B8" letter-spacing="1.2">WHILE YOU WERE CLOSED</text>
  <g font-size="17">
    <circle cx="1064" cy="352" r="11" fill="#DBEAFE"/><text x="1064" y="357" font-size="12" font-weight="800" fill="#2563EB" text-anchor="middle">&#10003;</text>
    <text x="1088" y="358" fill="#0F172A" font-weight="700">Answered 6 after-hours calls</text>
    <text x="1088" y="384" fill="#64748B" font-size="15">Pricing, recovery, and scheduling questions</text>

    <circle cx="1064" cy="428" r="11" fill="#DBEAFE"/><text x="1064" y="433" font-size="12" font-weight="800" fill="#2563EB" text-anchor="middle">&#10003;</text>
    <text x="1088" y="434" fill="#0F172A" font-weight="700">Sent 11 follow-ups on open leads</text>
    <text x="1088" y="460" fill="#64748B" font-size="15">Until they book or say no</text>

    <circle cx="1064" cy="504" r="11" fill="#DBEAFE"/><text x="1064" y="509" font-size="12" font-weight="800" fill="#2563EB" text-anchor="middle">&#10003;</text>
    <text x="1088" y="510" fill="#0F172A" font-weight="700">Confirmed tomorrow's 8 appointments</text>
    <text x="1088" y="536" fill="#64748B" font-size="15">Reminders by text and email</text>

    <circle cx="1064" cy="580" r="11" fill="#DBEAFE"/><text x="1064" y="585" font-size="12" font-weight="800" fill="#2563EB" text-anchor="middle">&#10003;</text>
    <text x="1088" y="586" fill="#0F172A" font-weight="700">Drafted 4 emails for your approval</text>
    <text x="1088" y="612" fill="#64748B" font-size="15">In your clinic's voice</text>

    <circle cx="1064" cy="656" r="11" fill="#FEE2E2"/><text x="1064" y="661" font-size="12" font-weight="800" fill="#DC2626" text-anchor="middle">!</text>
    <text x="1088" y="662" fill="#0F172A" font-weight="700">Flagged 1 sensitive conversation</text>
    <text x="1088" y="688" fill="#64748B" font-size="15">Paused and waiting for your team</text>
  </g>
  <rect x="1052" y="724" width="348" height="2" fill="#E2E8F0"/>
  <g font-size="14" font-weight="700">
    <rect x="1052" y="748" width="128" height="34" rx="17" fill="#EFF6FF"/><text x="1116" y="771" fill="#2563EB" text-anchor="middle">Answers calls</text>
    <rect x="1190" y="748" width="150" height="34" rx="17" fill="#EFF6FF"/><text x="1265" y="771" fill="#2563EB" text-anchor="middle">Replies in seconds</text>
    <rect x="1052" y="792" width="136" height="34" rx="17" fill="#EFF6FF"/><text x="1120" y="815" fill="#2563EB" text-anchor="middle">Books consults</text>
    <rect x="1198" y="792" width="118" height="34" rx="17" fill="#EFF6FF"/><text x="1257" y="815" fill="#2563EB" text-anchor="middle">Follows up</text>
    <rect x="1052" y="836" width="160" height="34" rx="17" fill="#EFF6FF"/><text x="1132" y="859" fill="#2563EB" text-anchor="middle">Confirms appts</text>
    <rect x="1222" y="836" width="130" height="34" rx="17" fill="#EFF6FF"/><text x="1287" y="859" fill="#2563EB" text-anchor="middle">Drafts emails</text>
  </g>
  <text x="1052" y="912" font-size="15" fill="#94A3B8">Nothing sensitive moves without your team.</text>
</svg>
