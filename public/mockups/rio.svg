<svg viewBox="0 0 1500 980" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <rect width="1500" height="980" fill="#F8FAFC"/>
  <!-- sidebar -->
  <rect width="248" height="980" fill="#FFFFFF"/>
  <line x1="248" y1="0" x2="248" y2="980" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="46" cy="46" r="14" fill="#DB2777"/>
  <text x="70" y="52" font-size="21" font-weight="700" fill="#0F172A">ClinicTech</text>
  <text x="32" y="112" font-size="19" fill="#64748B">Home</text>
  <text x="32" y="156" font-size="19" fill="#64748B">Pipeline</text>
  <text x="32" y="200" font-size="19" fill="#64748B">Calendar</text>
  <text x="32" y="244" font-size="19" fill="#64748B">Library</text>
  <text x="32" y="308" font-size="14" font-weight="700" fill="#94A3B8" letter-spacing="1.5">AGENTS</text>
  <circle cx="42" cy="344" r="6" fill="#2563EB"/><text x="60" y="351" font-size="19" fill="#64748B">Mia</text>
  <circle cx="42" cy="388" r="6" fill="#7C3AED"/><text x="60" y="395" font-size="19" fill="#64748B">Vidi</text>
  <rect x="20" y="412" width="208" height="44" rx="10" fill="rgba(219,39,119,0.10)"/>
  <circle cx="42" cy="434" r="6" fill="#DB2777"/><text x="60" y="441" font-size="19" font-weight="700" fill="#BE185D">Rio</text>
  <circle cx="42" cy="478" r="6" fill="#16A34A"/><text x="60" y="485" font-size="19" fill="#64748B">Juno</text>
  <circle cx="42" cy="522" r="6" fill="#0D9488"/><text x="60" y="529" font-size="19" fill="#64748B">Quill</text>
  <circle cx="42" cy="566" r="6" fill="#D97706"/><text x="60" y="573" font-size="19" fill="#64748B">Atlas</text>

  <!-- header -->
  <text x="292" y="70" font-size="30" font-weight="800" fill="#0F172A">Rio &#183; Retention and reviews</text>
  <text x="292" y="102" font-size="18" fill="#64748B">Day 7, 14, 30, 60, and 90 check-ins, on schedule</text>

  <!-- stat cards -->
  <g>
    <rect x="292" y="130" width="272" height="104" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="316" y="178" font-size="30" font-weight="800" fill="#DB2777">38</text>
    <text x="316" y="208" font-size="16" fill="#64748B">check-ins sent this week</text>
    <rect x="580" y="130" width="272" height="104" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="604" y="178" font-size="30" font-weight="800" fill="#0F172A">12</text>
    <text x="604" y="208" font-size="16" fill="#64748B">new reviews this month</text>
    <rect x="868" y="130" width="272" height="104" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="892" y="178" font-size="30" font-weight="800" fill="#D97706">4.9</text>
    <text x="892" y="208" font-size="16" fill="#64748B">average Google rating</text>
    <rect x="1156" y="130" width="272" height="104" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
    <text x="1180" y="178" font-size="30" font-weight="800" fill="#16A34A">7</text>
    <text x="1180" y="208" font-size="16" fill="#64748B">patients rebooked this week</text>
  </g>

  <!-- follow-up list -->
  <rect x="292" y="266" width="700" height="672" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="320" y="312" font-size="16" font-weight="700" fill="#94A3B8" letter-spacing="1.2">PATIENT FOLLOW-UPS</text>

  <g font-size="18">
    <rect x="316" y="332" width="652" height="96" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="336" y="368" font-weight="700" fill="#0F172A">Carla M. &#183; day 30</text>
    <text x="336" y="398" fill="#64748B">Pain down from 7 to 1, hiking again</text>
    <rect x="812" y="360" width="136" height="34" rx="17" fill="#DCFCE7"/>
    <text x="880" y="383" font-size="14" font-weight="700" fill="#15803D" text-anchor="middle">Review posted</text>

    <rect x="316" y="444" width="652" height="96" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="336" y="480" font-weight="700" fill="#0F172A">Miguel S. &#183; day 60</text>
    <text x="336" y="510" fill="#64748B">Doing great, 6-month follow-up offered</text>
    <rect x="828" y="472" width="120" height="34" rx="17" fill="#DCFCE7"/>
    <text x="888" y="495" font-size="14" font-weight="700" fill="#15803D" text-anchor="middle">Rebooked</text>

    <rect x="316" y="556" width="652" height="96" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="336" y="592" font-weight="700" fill="#0F172A">Dana P. &#183; quiet for 4 months</text>
    <text x="336" y="622" fill="#64748B">Personal re-engagement note, replied in 2 hours</text>
    <rect x="820" y="584" width="128" height="34" rx="17" fill="#FCE7F3"/>
    <text x="884" y="607" font-size="14" font-weight="700" fill="#BE185D" text-anchor="middle">Re-engaged</text>

    <rect x="316" y="668" width="652" height="96" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="336" y="704" font-weight="700" fill="#0F172A">Robert H. &#183; day 14</text>
    <text x="336" y="734" fill="#64748B">Recovering on track, next check-in day 30</text>
    <rect x="816" y="696" width="132" height="34" rx="17" fill="#FCE7F3"/>
    <text x="882" y="719" font-size="14" font-weight="700" fill="#BE185D" text-anchor="middle">Check-in sent</text>

    <rect x="316" y="780" width="652" height="96" rx="12" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
    <text x="336" y="816" font-weight="700" fill="#0F172A">Alice T. &#183; day 7</text>
    <text x="336" y="846" fill="#64748B">Reports unusual swelling, conversation paused</text>
    <rect x="782" y="808" width="166" height="34" rx="17" fill="#FEE2E2"/>
    <text x="865" y="831" font-size="14" font-weight="700" fill="#DC2626" text-anchor="middle">Escalated to doctor</text>
  </g>

  <!-- review + reactivation panel -->
  <rect x="1024" y="266" width="404" height="672" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <text x="1052" y="312" font-size="16" font-weight="700" fill="#94A3B8" letter-spacing="1.2">LATEST REVIEW</text>
  <g font-size="26" fill="#F59E0B">
    <text x="1052" y="356">&#9733;&#9733;&#9733;&#9733;&#9733;</text>
  </g>
  <g font-size="17" fill="#334155">
    <text x="1052" y="396">"I'm hiking again for the first time in</text>
    <text x="1052" y="424">years. The team checked on me every</text>
    <text x="1052" y="452">step of recovery."</text>
  </g>
  <text x="1052" y="490" font-size="15" font-weight="700" fill="#0F172A">Carla M. &#183; Google review, day 30</text>
  <rect x="1052" y="518" width="348" height="2" fill="#E2E8F0"/>

  <text x="1052" y="566" font-size="16" font-weight="700" fill="#94A3B8" letter-spacing="1.2">REACTIVATION CAMPAIGN</text>
  <text x="1052" y="606" font-size="17" font-weight="700" fill="#0F172A">14 quiet patients invited back</text>
  <rect x="1052" y="628" width="348" height="12" rx="6" fill="#F1F5F9"/>
  <rect x="1052" y="628" width="196" height="12" rx="6" fill="#DB2777"/>
  <text x="1052" y="672" font-size="15" fill="#64748B">8 replied &#183; 3 booked so far</text>

  <rect x="1052" y="706" width="348" height="2" fill="#E2E8F0"/>
  <text x="1052" y="752" font-size="16" font-weight="700" fill="#94A3B8" letter-spacing="1.2">FEEDS THE LIBRARY</text>
  <g font-size="15" fill="#64748B">
    <text x="1052" y="788">Strong outcomes become patient stories.</text>
    <text x="1052" y="812">Mia cited Carla's story 12 times this</text>
    <text x="1052" y="836">month while talking to new leads.</text>
  </g>
  <text x="1052" y="898" font-size="15" fill="#94A3B8">Warning signs escalate to your doctor, always.</text>
</svg>
